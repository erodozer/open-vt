name: Build Project
on:
  push:
    paths:
    - "thirdparty/*"
    - "lib/*"
    - "studio/*"
    - "ui/*"
    - project.godot

env:
  project: openvt
  
jobs:
  fetch-godot:
    name: Fetch ayagami patched godot engine
    runs-on: ubuntu-latest
    steps:
      - name: Get cached Godot
        id: cache
        uses: actions/cache@v6
        with:
          key: godot
          path: ./bin/godot
      - uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'AyagamiDev/ayagami-gd'
          version: 'tags/godot'
          regex: true
          file: 'godot.*'
          target: 'bin/godot/'
      - name: Extract artifacts
        working-directory: bin/godot
        run: |
          touch _sc_
          mkdir -p editor_data/export_templates/4.7.1.stable
          for artifact in *.editor.*; do
            chmod +x $artifact
          done

          mv godot.linuxbsd.template_release.x86_64 editor_data/export_templates/4.7.1.stable/linux_release.x86_64

  build-dependencies:
    name: Builds extensions for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          #- runner: windows-latest
          #  platform: windows
          - runner: ubuntu-latest
            platform: linux
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      - name: Compute Cache Key
        id: cache-key
        run: |
          submodules= 
          for module in $(git config --file .gitmodules --get-regexp path | awk '{ print $2 }'); do
            submodules+="$(git rev-parse HEAD:$module)"
          done
          echo "submodules: $submodules"
          hash=$(cksum <<< $submodules | cut -f 1 -d ' ')
          echo "hash: $hash"
          echo "key=addons_$hash" >> "$GITHUB_OUTPUT"
      - name: Prepare Addon Caches
        id: cache
        uses: actions/cache@v6
        with:
          key: ${{ steps.cache-key.outputs.key }}_${{ matrix.platform }}
          path: ./addons
          enableCrossOsArchive: true
      - name: Fetch Linux dependencies
        if: matrix.platform == 'linux' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y libudev-dev libinput-dev
      - name: Build Addons
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./build_dependencies.sh
      - name: List Files
        run: find addons/
  
  release:
    name: Builds executable for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: [fetch-godot, build-dependencies]
    defaults:
      run:
        # Use bash shells on all platforms.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # - identifier: windows-release
          #   name: Windows Release
          #   target: template_release
          #   platform: windows
          #   arch: x86_64
          #   output_name: openvt.exe
          - identifier: linux-release
            name: Linux Release
            target: template_release
            platform: linux
            arch: x86_64
            output_name: openvt.x86_64
    steps:
      - name: Checkout OpenVT
        uses: actions/checkout@v6
      - name: Load Addon Caches
        id: addon-cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ needs.build-dependencies.outputs.cache-key }}_${{ matrix.platform }}
          path: ./addons
          enableCrossOsArchive: true
      - name: Load Godot Caches
        id: godot-cache
        uses: actions/cache/restore@v6
        with:
          key: godot
          path: ./bin/godot
          enableCrossOsArchive: true
      - name: Generate Release
        run: |
          mkdir -p bin/${{ matrix.platform }}
          GODOT_BIN=$(find bin -iname '*${{matrix.platform}}*editor*')
          $GODOT_BIN --headless --export-release "${{ matrix.platform }}" "bin/${{ matrix.platform }}/${{ matrix.output_name }}"
      - name: Copy extra resources
        run: |
          mkdir "bin/${{ matrix.platform }}/branding"
          find branding/ ! -name "*.import" -type f -print0 | xargs -0 cp -t "bin/${{ matrix.platform }}/branding"
          mkdir "bin/${{ matrix.platform }}/license"
          find license/ ! -name "*.import" -type f -print0 | xargs -0 cp -t "bin/${{ matrix.platform }}/license"
          cp LICENSE.txt README.md "bin/${{ matrix.platform }}"
      - name: Verify Output
        run: |
          find bin/${{ matrix.platform }} -type f
      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.project }}.${{ matrix.platform }}
          path: ./bin/${{ matrix.platform }}/*
      - name: Upload to Itchio (Stable)
        if: startsWith(github.event.ref, 'refs/tags/v')
        uses: yeslayla/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: ${{ matrix.platform }}-stable
          ITCH_GAME: ${{ env.project }}
          ITCH_USER: ${{ secrets.BUTLER_USER }}
          PACKAGE: bin/${{matrix.platform}}
          VERSION: ${{ github.ref_name }}
